<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>O Reino das Letras Perdidas</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjRkY4QjZCIi8+PHRleHQgeD0iMjU2IiB5PSIzMDAiIGZvbnQtc2l6ZT0iMzAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj7wn5OWPC90ZXh0Pjwvc3ZnPg==">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjRkY4QjZCIi8+PHRleHQgeD0iMjU2IiB5PSIzMDAiIGZvbnQtc2l6ZT0iMzAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj7wn5OWPC90ZXh0Pjwvc3ZnPg==">

<meta name="apple-mobile-web-app-title" content="Reino das Letras">
<style>
  :root{
    --mw: 640px;
    --ceu: #6EC6E3;
    --ceu-escuro: #4CA9CC;
    --grama: #8FD14F;
    --grama-escura: #6FB238;
    --sol: #FFD447;
    --magia: #9B6BD9;
    --coral: #FF8B6B;
    --coral-escuro: #E96E4D;
    --tinta: #2B2340;
    --branco: #FFFDF8;
    --sombra: rgba(43,35,64,0.25);
    --casinha-w: calc(var(--mw) * 15 / 100);
    --avatar-w: calc(var(--mw) * 18 / 100);
    --bolha-w: calc(var(--mw) * 14 / 100);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ height:100%; }
  body{
    margin:0; padding:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #DCE7EE;
    color: var(--tinta);
    width:100%;
    position:relative;
    user-select:none;
    overflow-x:hidden;
  }
  #moldura{
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    height:100vh;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background: linear-gradient(180deg, var(--ceu) 0%, var(--ceu) 60%, var(--grama) 60%, var(--grama-escura) 100%);
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }
  @media (min-width: 641px){
    body{ display:flex; justify-content:center; }
    #moldura{ margin: 2vh auto; height: 96vh; border-radius: 20px; flex-shrink:0; }
  }
  h1,h2,h3, .titulo{ font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  h2.titulo{ font-size: calc(var(--mw) * 6 / 100); font-weight:800; margin: 1.2vh 0; line-height:1.2; }

  #app{ position:relative; z-index:1; width:100%; min-height:100%; }

  .scene{
    position:absolute; top:0; right:0; bottom:0; left:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 3vh calc(var(--mw) * 4 / 100);
    padding: 3vh calc(var(--mw) * 4 / 100) calc(3vh + env(safe-area-inset-bottom, 0px)) calc(var(--mw) * 4 / 100);
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    min-height:100%;
  }
  .scene.ativa{ display:flex; animation: entra 0.4s ease; }
  @keyframes entra{ from{opacity:0;} to{opacity:1;} }

  .sol{
    position:absolute; top:3vh; right:calc(var(--mw) * 5 / 100);
    width:calc(var(--mw) * 9 / 100); height:calc(var(--mw) * 9 / 100); border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #FFE58A, var(--sol));
    box-shadow: 0 0 24px 8px rgba(255,212,71,0.5);
    pointer-events:none;
  }
  .nuvem{ position:absolute; background:rgba(255,255,255,0.85); border-radius:50%; pointer-events:none; z-index:0; }
  .nuvem::before, .nuvem::after{ content:""; position:absolute; background:inherit; border-radius:50%; }
  .nuvem1{ top:6vh; left:calc(var(--mw) * 8 / 100); width:calc(var(--mw) * 14 / 100); height:5vh; }
  .nuvem1::before{ width:calc(var(--mw) * 8 / 100); height:calc(var(--mw) * 8 / 100); top:calc(var(--mw) * -4 / 100); left:calc(var(--mw) * 1 / 100); }
  .nuvem1::after{ width:calc(var(--mw) * 6 / 100); height:calc(var(--mw) * 6 / 100); top:calc(var(--mw) * -3 / 100); left:calc(var(--mw) * 7 / 100); }
  .nuvem2{ top:12vh; right:calc(var(--mw) * 14 / 100); width:calc(var(--mw) * 11 / 100); height:4vh; opacity:0.8; }
  .nuvem2::before{ width:calc(var(--mw) * 6 / 100); height:calc(var(--mw) * 6 / 100); top:calc(var(--mw) * -3 / 100); left:calc(var(--mw) * 1 / 100); }
  .nuvem2::after{ width:calc(var(--mw) * 5 / 100); height:calc(var(--mw) * 5 / 100); top:calc(var(--mw) * -2.5 / 100); left:calc(var(--mw) * 5 / 100); }
  .argola{
    position:absolute; border-radius:50%; border: calc(var(--mw) * 1 / 100) solid var(--sol);
    background:transparent; pointer-events:none; z-index:0;
    box-shadow: 0 0 10px rgba(255,212,71,0.6);
    animation: flutua 4s ease-in-out infinite;
  }
  .argola1{ top:38vh; left:calc(var(--mw) * 6 / 100); width:calc(var(--mw) * 6 / 100); height:calc(var(--mw) * 6 / 100); }
  .argola2{ top:22vh; right:calc(var(--mw) * 22 / 100); width:calc(var(--mw) * 5 / 100); height:calc(var(--mw) * 5 / 100); animation-delay:1.5s; }
  .colinas{
    position:absolute; left:0; right:0; top:60%; height:8vh; z-index:0;
    pointer-events:none; opacity:0.55;
    background-image:
      radial-gradient(circle at 8% 0%, var(--grama-escura) 0%, var(--grama-escura) 7vh, transparent 7vh),
      radial-gradient(circle at 28% 0%, var(--grama-escura) 0%, var(--grama-escura) 6vh, transparent 6vh),
      radial-gradient(circle at 48% 0%, var(--grama-escura) 0%, var(--grama-escura) 7vh, transparent 7vh),
      radial-gradient(circle at 68% 0%, var(--grama-escura) 0%, var(--grama-escura) 6vh, transparent 6vh),
      radial-gradient(circle at 88% 0%, var(--grama-escura) 0%, var(--grama-escura) 7vh, transparent 7vh);
  }

  .painel{
    background: var(--branco);
    border-radius: 24px;
    box-shadow: 0 8px 0 var(--sombra), 0 12px 26px rgba(43,35,64,0.15);
    padding: 3vh calc(var(--mw) * 4 / 100);
    max-width: 620px;
    width:100%;
    text-align:center;
    margin-bottom: 2vh;
  }

  .titulo-jogo{
    font-size: calc(var(--mw) * 8 / 100);
    color: var(--branco);
    text-shadow: 0 4px 0 var(--coral-escuro), 0 8px 16px rgba(0,0,0,0.2);
    margin: 1.5vh 0 1vh 0;
    letter-spacing: 1px;
    line-height:1.15;
  }

  .subtitulo{
    font-size: calc(var(--mw) * 2.6 / 100);
    font-weight:700;
    max-width: 90%;
    line-height:1.5;
    margin: 0 auto 2vh auto;
  }

  .balao-fala{
    background: var(--branco);
    border-radius: 20px;
    padding: 2.2vh calc(var(--mw) * 4 / 100);
    max-width: 560px;
    position:relative;
    box-shadow: 0 5px 0 var(--sombra);
    margin: 0 auto 2vh auto;
  }
  .balao-nome{ font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; font-weight:800; color: var(--magia); }
  .balao-texto{ font-size: calc(var(--mw) * 2.6 / 100); font-weight:700; line-height:1.5; margin:4px 0 0 0;}

  .npc-avatar{
    width: var(--avatar-w); height:var(--avatar-w); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--avatar-w) * 0.5);
    margin: 0 auto 1.2vh auto;
    box-shadow: 0 6px 0 var(--sombra);
    animation: flutua 3s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes flutua{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  button{ font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; border:none; cursor:pointer; }

  .btn-grande{
    background: var(--coral);
    color: var(--branco);
    font-size: calc(var(--mw) * 3 / 100);
    font-weight:700;
    padding: 1.6vh calc(var(--mw) * 6 / 100);
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--coral-escuro);
    margin: 6px;
    transition: transform 0.1s;
  }
  .btn-grande:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-escuro); }
  .btn-secundario{ background: var(--magia); box-shadow: 0 6px 0 #7748AD; }

  .btn-audio{
    background: var(--magia);
    color: var(--branco);
    width:calc(var(--mw) * 10 / 100); height:calc(var(--mw) * 10 / 100); border-radius:50%;
    font-size:calc(var(--mw) * 3 / 100);
    box-shadow: 0 5px 0 #7748AD;
    position:absolute; top:2.5vh; left:calc(var(--mw) * 3 / 100);
    z-index:5;
  }
  .btn-audio:active{ transform: translateY(4px); box-shadow:none; }

  .btn-reset{
    position:absolute; bottom:1vh; right:calc(var(--mw) * 2 / 100);
    background:none; color: rgba(43,35,64,0.55);
    font-size:0.7rem; font-family:'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight:700;
    text-decoration:underline; padding:6px;
  }
  .btn-home{
    position:absolute; bottom:1.5vh; left:calc(var(--mw) * 2 / 100);
    background: var(--magia); color:var(--branco);
    width:44px; height:44px; border-radius:50%;
    font-size:1.3rem;
    box-shadow: 0 4px 0 #7748AD;
    z-index:5;
  }
  .btn-home:active{ transform: translateY(3px); box-shadow:none; }
  .spinner{
    width:64px; height:64px; border-radius:50%;
    border: 8px solid rgba(255,255,255,0.45); border-top-color: var(--coral);
    animation: girar 0.9s linear infinite;
  }
  @keyframes girar{ to{ transform:rotate(360deg); } }
  .capa-jogo-avatar{
    width:calc(var(--mw) * 26 / 100); height:calc(var(--mw) * 26 / 100); max-width:150px; max-height:150px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--mw) * 12 / 100);
    box-shadow: 0 8px 0 var(--sombra), 0 12px 26px rgba(43,35,64,0.2);
    margin-bottom: 2vh; animation: flutua 3s ease-in-out infinite;
  }
  .capa-jogo-rotulo{
    font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; font-weight:800; font-size:0.95rem; letter-spacing:3px;
    color: var(--tinta); opacity:0.6; margin:0 0 0.5vh 0;
  }

  /* teclado (usado na criação do nome e na Fase 5) */
  .campo-nome{
    font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; font-size: calc(var(--mw) * 6 / 100);
    letter-spacing:6px; min-height: 50px;
    color: var(--magia); font-weight:800;
    border-bottom: 5px dashed var(--coral);
    padding: 0 16px; margin: 0 auto 2vh auto;
    max-width: 90%;
  }
  .teclado{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 1vh;
    max-width: 640px;
    width:100%;
    margin: 0 auto;
  }
  .fileira-teclado{
    display:flex;
    gap: calc(var(--mw) * 1 / 100);
    justify-content:center;
    width:100%;
  }
  .tecla{
    background: var(--sol);
    color: var(--tinta);
    font-size: calc(var(--mw) * 2.6 / 100);
    font-weight:800;
    border-radius: 8px;
    flex: 1 1 0;
    min-width:0;
    max-width: 54px;
    aspect-ratio: 1;
    box-shadow: 0 4px 0 #E0B426;
  }
  .tecla:active{ transform: translateY(3px); box-shadow:none; }
  .tecla-especial{ background: var(--coral); color:var(--branco); box-shadow: 0 4px 0 var(--coral-escuro); flex: 1.6 1 0; max-width:86px; font-size: calc(var(--mw) * 2 / 100); }
  .tecla.dica{ animation: pisca 0.9s ease-in-out infinite; background:#FFF3C4; }

  /* vila e casinhas (Fase 1) */
  .vila{
    display:flex; gap: calc(var(--mw) * 2 / 100); justify-content:center; align-items:flex-end;
    margin: 1.5vh 0 2.5vh 0; flex-wrap:wrap;
  }
  .casinha{ width: var(--casinha-w); display:flex; flex-direction:column; align-items:center; }
  .telhado{
    width:0; height:0;
    border-left: calc(var(--casinha-w)/2) solid transparent;
    border-right: calc(var(--casinha-w)/2) solid transparent;
    border-bottom: calc(var(--casinha-w)*0.42) solid var(--coral-escuro);
  }
  .parede{
    width:var(--casinha-w); height:calc(var(--casinha-w)*0.78); background:var(--branco); border-radius: 0 0 8px 8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; font-weight:800; font-size:calc(var(--casinha-w)*0.4); color:#ccc;
  }
  .parede.completa{ color: var(--magia); animation: brilha 0.6s ease; }
  @keyframes brilha{ 0%{ transform:scale(1);} 40%{transform:scale(1.2);} 100%{transform:scale(1);} }

  /* opções (letras, sílabas, imagens, palavras) */
  .opcoes{
    display:flex; gap: calc(var(--mw) * 2.5 / 100); justify-content:center; flex-wrap:wrap;
    margin: 1.5vh 0; width:100%;
  }
  .bolha-opcao{
    min-width: var(--bolha-w); height:var(--bolha-w); border-radius:50%;
    background: var(--branco); padding: 0 6px;
    font-family:'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight:900; font-size:calc(var(--mw) * 4 / 100);
    color: var(--tinta);
    box-shadow: 0 5px 0 var(--sombra);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s;
  }
  .bolha-opcao:active{ transform: translateY(4px) scale(0.96); }
  .bolha-opcao.dica{ animation: pisca 0.9s ease-in-out infinite; background: #FFF3C4; }
  @keyframes pisca{ 0%,100%{ box-shadow:0 5px 0 var(--sombra);} 50%{ box-shadow:0 5px 0 var(--sombra), 0 0 0 8px rgba(255,212,71,0.6);} }
  .bolha-opcao.errada-anim{ animation: bamboleia 0.4s ease; }
  @keyframes bamboleia{ 0%,100%{transform:rotate(0);} 30%{transform:rotate(-8deg);} 60%{transform:rotate(8deg);} }
  .bolha-opcao.certa-anim{ animation: acerto 0.5s ease; }
  @keyframes acerto{ 0%{transform:scale(1);} 50%{transform:scale(1.3) rotate(10deg); background:#D8F5C0;} 100%{transform:scale(1);} }
  .bolha-opcao.usada{ visibility:hidden; }

  /* pecinhas retangulares (sílabas / palavras da frase) */
  .peca{
    background: var(--branco); font-weight:900; font-family:'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: calc(var(--mw) * 3.2 / 100);
    padding: 1.6vh calc(var(--mw) * 2.5 / 100);
    border-radius: 14px;
    box-shadow: 0 5px 0 var(--sombra);
    transition: transform 0.15s;
  }
  .peca:active{ transform: translateY(4px) scale(0.97); }
  .peca.usada{ visibility:hidden; }
  .peca.errada-anim{ animation: bamboleia 0.4s ease; }

  .slots{ display:flex; gap: calc(var(--mw) * 2 / 100); justify-content:center; flex-wrap:wrap; margin: 1.5vh 0; min-height: 44px; }
  .slot{
    min-width: 46px; height:46px; border-radius:10px;
    background: rgba(255,255,255,0.5);
    border: 3px dashed rgba(43,35,64,0.25);
    display:flex; align-items:center; justify-content:center;
    font-family:'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight:900; font-size:1.1rem; color: var(--magia);
    padding: 0 8px;
  }
  .slot.preenchido{ background: var(--branco); border-style:solid; border-color: var(--magia); }

  .progresso{ display:flex; gap:8px; margin-top:0.5vh; flex-wrap:wrap; justify-content:center; }
  .bolinha{ width:12px; height:12px; border-radius:50%; background: rgba(255,255,255,0.5); }
  .bolinha.feita{ background: var(--sol); }

  /* mapa em formato de caminho (trilha subindo pela tela) */
  .tela-mapa{ padding:0 !important; align-items:stretch !important; }
  .mapa-cabecalho{
    position:sticky; top:0; z-index:6; background:rgba(255,253,248,0.95);
    padding: 2vh calc(var(--mw) * 4 / 100) 1.5vh calc(var(--mw) * 4 / 100);
    text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .caminho{
    display:flex; flex-direction:column-reverse;
    padding: 3vh calc(var(--mw) * 4 / 100) 2vh calc(var(--mw) * 4 / 100);
    position:relative;
  }
  .mundo-secao{ display:flex; flex-direction:column-reverse; align-items:center; padding-top:2vh; }
  .mundo-rotulo{
    font-family:'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif; font-weight:800;
    font-size: calc(var(--mw) * 4.4 / 100);
    color:var(--branco); text-align:center; padding: 8px calc(var(--mw) * 5 / 100);
    border-radius:999px; margin-top:2vh; box-shadow:0 4px 0 var(--sombra);
  }
  .linha-no{ display:flex; align-items:center; width:100%; margin:14px 0; position:relative; }
  .linha-no.pos-esq{ justify-content:flex-start; }
  .linha-no.pos-centro{ justify-content:center; }
  .linha-no.pos-dir{ justify-content:flex-end; }
  .no-nivel{
    width:calc(var(--mw) * 15 / 100); height:calc(var(--mw) * 15 / 100);
    max-width:74px; max-height:74px; min-width:50px; min-height:50px;
    border-radius:50%; background:var(--branco);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--mw) * 5.5 / 100); font-weight:900;
    box-shadow: 0 5px 0 var(--sombra); position:relative; flex-shrink:0;
    border:4px solid transparent;
    overflow:hidden;
  }
  .no-nivel:not(.bloqueado){ cursor:pointer; }
  .no-nivel:not(.bloqueado):active{ transform:translateY(4px); box-shadow:none; }
  .no-nivel.feito{ background:var(--sol); border-color:#E0B426; }
  .no-nivel.bloqueado{ opacity:0.45; }
  .no-nivel.atual{ animation:pisca-marco 1.2s ease-in-out infinite; border-color:var(--coral); }
  .no-numero{
    position:absolute; bottom:-8px; right:-4px; background:var(--magia); color:white;
    font-size:0.65rem; font-weight:800; border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 #7748AD;
  }
  @keyframes pisca-marco{ 0%,100%{ box-shadow:0 5px 0 var(--sombra);} 50%{ box-shadow:0 5px 0 var(--sombra), 0 0 0 10px rgba(255,139,107,0.5);} }
  .marco-emoji{ font-size:calc(var(--mw) * 5 / 100); }
  .marco-nome{ font-size:calc(var(--mw) * 2 / 100); font-weight:800; text-align:center; padding:0 4px;}
  .cadeado{ font-size:calc(var(--mw) * 1.8 / 100); font-weight:700; }

  @media (max-height: 640px){
    .npc-avatar{ display:none; }
    .painel{ padding: 1.4vh calc(var(--mw) * 3 / 100); }
  }
  @media (max-width: 360px){
    .titulo-jogo{ font-size:1.8rem; }
  }
</style>
</head>
<body>
<div id="moldura">
  <div class="sol"></div>
  <div class="nuvem nuvem1"></div>
  <div class="nuvem nuvem2"></div>
  <div class="argola argola1"></div>
  <div class="argola argola2"></div>
  <div class="colinas"></div>
  <div id="app"></div>
</div>

<script>
/* =========================================================
   O REINO DAS LETRAS PERDIDAS — protótipo jogável
   5 fases completas + progresso salvo automaticamente
   (localStorage do navegador — funciona offline, no aparelho)
   ========================================================= */

const app = document.getElementById('app');

// Mantém --mw (largura real da moldura do jogo) sincronizada, para que todas as
// medidas em "vw" do CSS sejam relativas à moldura (max. 640px), e não à janela
// inteira do navegador — isso é o que evita elementos gigantes no computador.
function atualizarLarguraMoldura(){
  const m = document.getElementById('moldura');
  if(m) document.documentElement.style.setProperty('--mw', m.getBoundingClientRect().width + 'px');
}
atualizarLarguraMoldura();
window.addEventListener('resize', atualizarLarguraMoldura);
window.addEventListener('orientationchange', atualizarLarguraMoldura);

// ---------- instalar na tela inicial ----------
let promptInstalacaoAdiado = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  promptInstalacaoAdiado = e;
  const btn = document.getElementById('btnInstalar');
  if(btn) btn.style.display = 'inline-block';
});
function tentarInstalar(){
  if(promptInstalacaoAdiado){
    promptInstalacaoAdiado.prompt();
    const limpar = function(){ promptInstalacaoAdiado=null; };
    if(promptInstalacaoAdiado.userChoice && promptInstalacaoAdiado.userChoice.then) promptInstalacaoAdiado.userChoice.then(limpar, limpar);
    else limpar();
  } else {
    alert('Para instalar o jogo na tela inicial:\n\n1. Toque no menu do navegador (geralmente os 3 pontinhos ⋮ no canto)\n2. Toque em "Adicionar à tela inicial" ou "Instalar app"\n\nAssim um ícone do jogo aparece direto na tela do tablet!');
  }
}

const estado = {

// ---------- salvar / carregar progresso ----------
function salvarProgresso(){
  try{
    const dados = { nome: estado.nome, nivelAtual: estado.nivelAtual };
    localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(dados));
  }catch(e){ /* localStorage pode estar bloqueado — o jogo segue funcionando, só sem salvar */ }
}
function carregarProgresso(){
  try{
    const bruto = localStorage.getItem(CHAVE_SALVAMENTO);
    return bruto ? JSON.parse(bruto) : null;
  }catch(e){ return null; }
}
function apagarProgresso(){
  try{ localStorage.removeItem(CHAVE_SALVAMENTO); }catch(e){}
  location.reload();
}
function botaoReset(){
  return `<button class="btn-reset" onclick="if(confirm('Apagar o progresso e recomeçar do zero?')) apagarProgresso();">🔄 recomeçar aventura</button>`;
}

// ---------- narração (Web Speech API) ----------
window._ultimaFala = '';
window._vozesCache = [];
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = function(){ window._vozesCache = window.speechSynthesis.getVoices(); };
  window._vozesCache = window.speechSynthesis.getVoices();
}
function vozesPortugues(){
  const todas = window._vozesCache && window._vozesCache.length ? window._vozesCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  const pt = todas.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('pt')===0; });
  return pt.length ? pt : todas; // se não achar nenhuma em português, usa qualquer voz disponível
}
// tenta reconhecer, pelo nome da voz, quais soam mais "masculinas" (heurística, depende do que
// o Android/fabricante do tablet instalou — nem todo aparelho tem mais de uma voz em português)
function pareceMasculina(v){
  const n = (v.name||'').toLowerCase();
  return n.indexOf('male')>-1 || n.indexOf('masculin')>-1 || n.indexOf(' b')>-1 || n.indexOf('#2')>-1;
}
function falar(texto){
  window._ultimaFala = texto;
  if(!estado.audioLigado) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = 0.95;
    u.pitch = 1.05;
    const vozes = vozesPortugues();
    if(vozes[estado.vozIndex]) u.voice = vozes[estado.vozIndex];
    window.speechSynthesis.speak(u);
  }catch(e){ /* navegador sem suporte: segue só com o texto na tela */ }
}
function alternarAudio(){
  estado.audioLigado = !estado.audioLigado;
  const botoes = document.querySelectorAll('.btn-audio');
  for(let i=0;i<botoes.length;i++) botoes[i].textContent = estado.audioLigado ? '🔊' : '🔈';
  if(!estado.audioLigado && window.speechSynthesis) window.speechSynthesis.cancel();
  else if(estado.audioLigado && window._ultimaFala) falar(window._ultimaFala);
}
function alternarVoz(){
  const vozes = vozesPortugues();
  if(vozes.length<2){
    alert('Este tablet só tem uma voz instalada para português. Para ter outra opção de voz (por exemplo uma masculina), é preciso instalar um pacote de voz extra em: Configurações do Android > Acessibilidade > Conversão de texto em voz > Motor de voz preferido > instalar dados de voz.');
    return;
  }
  estado.vozIndex = (estado.vozIndex + 1) % vozes.length;
  falar(window._ultimaFala || ('Testando esta voz.'));
}
function botaoAudio(textoParaRepetir){
  return `<button class="btn-audio" onclick="alternarAudio()" title="Ligar/desligar o som">${estado.audioLigado ? '🔊':'🔈'}</button>
  <button class="btn-audio" style="left:auto; right:calc(var(--mw) * 3 / 100); background:var(--coral);" onclick="alternarVoz()" title="Trocar a voz">🎙️</button>
  <button class="btn-home" onclick="if(confirm('Voltar para a tela inicial? Seu progresso fica salvo.')) cenaTitulo();" title="Voltar para a home">🏠</button>`;
}

// ---------- deteccao de suporte a emoji (com fallback em letra, para telas cuja fonte nao tem certos simbolos) ----------
const _emojiCache = {};
function _emojiSuportado(ch){
  if(_emojiCache.hasOwnProperty(ch)) return _emojiCache[ch];
  try{
    const tam = 24;
    function desenha(caracter){
      const c = document.createElement('canvas'); c.width=tam; c.height=tam;
      const ctx = c.getContext('2d');
      ctx.textBaseline='top'; ctx.font=(tam-4)+'px sans-serif';
      ctx.fillStyle='#000';
      ctx.fillText(caracter, 0, 0);
      return ctx.getImageData(0,0,tam,tam).data;
    }
    const a = desenha(ch);
    const b = desenha('\uE000'); // area de uso privado do Unicode, garantidamente sem glifo definido em nenhuma fonte
    let iguais = 0;
    const totalPixels = a.length/4;
    for(let i=0;i<a.length;i+=4){ if(a[i]===b[i] && a[i+1]===b[i+1] && a[i+2]===b[i+2] && a[i+3]===b[i+3]) iguais++; }
    const suportado = (iguais/totalPixels) < 0.985; // se quase todo pixel bate com o "sem glifo", nao esta desenhando o simbolo de verdade
    _emojiCache[ch] = suportado;
    return suportado;
  }catch(e){ _emojiCache[ch]=true; return true; }
}

// gera as 3 fileiras de um teclado QWERTY reutilizável
function fileirasTeclado(onTecla, comApagar, aoApagar){
  const fileiras = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ];
  return fileiras.map((fileira,i)=>{
    const teclas = fileira.map(l=>`<button class="tecla" onclick="${onTecla}('${l}')">${l}</button>`).join('');
    const apagar = (comApagar && i===fileiras.length-1) ? `<button class="tecla tecla-especial" onclick="${aoApagar}()">⌫</button>` : '';
    return `<div class="fileira-teclado">${teclas}${apagar}</div>`;
  }).join('');
}

/* =========================================================

   ========================================================= */
function cenaFimNivel(){
  const indiceConcluido = estado.nivelAtual;
  const nivel = NIVEIS[indiceConcluido];
  const ultimoDoMundo = ehUltimoDoMundo(indiceConcluido);
  const ultimoNivelDoJogo = indiceConcluido === NIVEIS.length-1;

  estado.nivelAtual++;
  estado.erros = 0;
  salvarProgresso();

  if(ultimoNivelDoJogo){ cenaFimDeJogo(); return; }

  if(ultimoDoMundo){
    const mundo = MUNDOS_INFO[nivel.mundo-1];
    const texto = mundo.fim(estado.nome);
    mostrarCena(`
      ${botaoAudio(texto)}
      <div class="painel" style="margin-top:5vh;">
        <div style="font-size:calc(var(--mw) * 8 / 100);">🎉${mundo.recompensa}</div>

        <button class="btn-grande" onclick="cenaMapa()">🗺️ Voltar ao mapa</button>
      </div>
    `, ()=> falar(texto));
  } else {
    const texto = 'Muito bem! Vamos para o próximo desafio?';
    mostrarCena(`
      ${botaoAudio(texto)}
      <div class="painel" style="margin-top:6vh;">
        <div style="font-size:calc(var(--mw) * 7 / 100);">🎉</div>

  }
}

/* =========================================================

function opcoesParaTentativa(valorCorreto, todosPossiveis, numOpcoes){
  const outras = todosPossiveis.filter(v=>v!==valorCorreto);
  return embaralha([valorCorreto, ...amostra(outras, Math.min(numOpcoes-1, outras.length))]);
}
function cenaDesafioVogal(){
  const v = nivelAtualItem().dados;
  const numOpcoes = estado.erros===0?4 : estado.erros===1?3 : estado.erros===2?2 : 1;
  const opcoes = opcoesParaTentativa(v.letra, VOGAIS.map(x=>x.letra), numOpcoes);
  const exemplo = exemploDaTentativa(v, estado.erros);
  const introducao = ehPrimeiroDoMundo(estado.nivelAtual) ? `Ufa, que bom que você chegou, ${estado.nome}! Todas as portas da vila perderam suas letrinhas! ` : '';
  const textoInstrucao = `Escute com atenção: "${v.som}" de ${exemplo.palavra}! Toque na letrinha que faz esse som!`;
  mostrarCena(`
    ${botaoAudio(introducao+textoInstrucao)}
    <div class="painel" style="margin-top:4vh;">
      <div class="npc-avatar" style="background:var(--sol);">👴</div>
      <div class="balao-fala"><span class="balao-nome">Seu Vogalino:</span><p class="balao-texto">${introducao}${icone(exemplo.emoji)} ${textoInstrucao}</p></div>
      <div class="opcoes">${opcoes.map(l=>`<button class="bolha-opcao" onclick="tentarVogal('${l}','${v.letra}', this)">${l}</button>`).join('')}</div>
    </div>
  `, ()=> falar(introducao+textoInstrucao));
}
function tentarVogal(escolhida, correta, elemento){
  if(escolhida===correta){

    const nos = niveisDoMundo.map((n,pos)=>{
      const feito = n.indice < estado.nivelAtual;
      const atual = n.indice === estado.nivelAtual;
      const bloqueado = n.indice > estado.nivelAtual;
      const posClasse = ['pos-esq','pos-centro','pos-dir'][pos%3];
      const classes = ['no-nivel'];
      if(feito) classes.push('feito');
      if(atual) classes.push('atual');
      if(bloqueado) classes.push('bloqueado');
      const onclick = !bloqueado ? ` onclick="irParaNivel(${n.indice})"` : '';
      const conteudo = feito ? '✅' : bloqueado ? '🔒' : icone(n.emoji || mundo.emoji);
      return `<div class="linha-no ${posClasse}"><div class="${classes.join(' ')}"${onclick}>${conteudo}<div class="no-numero">${n.indice+1}</div></div></div>`;
    }).join('');
    return `<div class="mundo-secao">${nos}<div class="mundo-rotulo" style="background:${mundo.cor};">${icone(mundo.emoji)} ${mundo.nome}</div></div>`;
  }).join('');

  mostrarCena(`
    <div class="mapa-cabecalho">
      <h2 class="titulo" style="margin:0; font-size:calc(var(--mw) * 5 / 100);">🗺️ Mapa da Aventura</h2>
    </div>
    <div class="caminho">${secoes}</div>
  `);
  setTimeout(()=>{
    const atual = document.querySelector('.no-nivel.atual');
    if(atual && atual.scrollIntoView){ try{ atual.scrollIntoView({block:'center'}); }catch(e){} }
  }, 60);
}
// navega para um nível específico do mapa (níveis já liberados ou concluídos)
function irParaNivel(indice){
  estado.nivelAtual = indice;
  estado.erros = 0;
  salvarProgresso();
  cenaCarregandoNivel(indice);
}

/* =========================================================
   INÍCIO — retoma progresso salvo ou começa do zero
   ========================================================= */
function retomarNaFase(){
  if(estado.nivelAtual >= NIVEIS.length){ cenaFimDeJogo(); return; }
  iniciarNivel(estado.nivelAtual);
}
function continuarProgressoSalvo(){
  const salvo = carregarProgresso();
  if(salvo && salvo.nome){
    Object.assign(estado, salvo, {erros:0});
    cenaCarregandoRetomada(retomarNaFase);
  }
  else cenaCriarNome();
}
(function iniciar(){
  const salvo = carregarProgresso();
  if(salvo && salvo.nome){
    Object.assign(estado, salvo, {erros:0});
    cenaCarregandoRetomada(retomarNaFase);
  } else {
    cenaTitulo();
  }
})();

// Hook de depuração (não afeta o jogo): útil para suporte técnico e testes automatizados.
window.__jogoDebug = { estado, VOGAIS, SILABAS, PALAVRAS, FRASES, CONFUSOR_PALAVRAS, BUDDIES_FASE2, BUDDIES_FASE3, BUDDIES_FASE4, NIVEIS, MUNDOS_INFO };
</script>
